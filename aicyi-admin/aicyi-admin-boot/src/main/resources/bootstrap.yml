#  通用配置（环境差异见 application-{dev,test,prod}.yml）
spring:
  application:
    name: aicyi-admin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      # dev 环境 Nacos 未开启鉴权（auth_enabled=false），留空避免 HttpLoginProcessor 无效重试；
      # test/prod 鉴权环境通过 NACOS_USERNAME / NACOS_PASSWORD 注入
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        namespace: ${NACOS_NAMESPACE:dev}
        group: DEFAULT_GROUP
      config:
        namespace: ${NACOS_NAMESPACE:dev}
        group: DEFAULT_GROUP
        file-extension: yaml
        # 中间件连接由 Nacos 共享配置统一管理（datasource/redis/rabbitmq，各环境 namespace 内维护）
        shared-configs:
          - data-id: aicyi-datasource.yml
            group: DEFAULT_GROUP
            refresh: true
          - data-id: aicyi-redis.yml
            group: DEFAULT_GROUP
            refresh: true
