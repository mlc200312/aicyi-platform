# =====================================================================
# bootstrap.yml —— Nacos 注册与配置中心引导（namespace 需在 bootstrap 阶段读取）
# =====================================================================
# 环境隔离：namespace = 环境（dev / test / prod），由启动参数或环境变量注入：
#   -Dspring.cloud.nacos.config.namespace=prod  或  NACOS_NAMESPACE=prod
# group = 业务域分组；dataId = ${spring.application.name}-${profile}.yaml
# =====================================================================
spring:
  application:
    name: aicyi-admin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      # dev 环境 Nacos 未开启鉴权（auth_enabled=false），留空避免 HttpLoginProcessor 无效重试；
      # test/prod 鉴权环境通过 NACOS_USERNAME / NACOS_PASSWORD 注入
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        namespace: ${NACOS_NAMESPACE:dev}
        group: DEFAULT_GROUP
      config:
        namespace: ${NACOS_NAMESPACE:dev}
        group: DEFAULT_GROUP
        file-extension: yaml
        # 共享中间件地址/密钥策略等跨环境一致配置
        shared-configs:
          - data-id: aicyi-datasource.yml
            group: DEFAULT_GROUP
            refresh: true
          - data-id: aicyi-redis.yml
            group: DEFAULT_GROUP
            refresh: true
