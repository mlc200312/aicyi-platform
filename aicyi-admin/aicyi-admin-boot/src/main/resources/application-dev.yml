# application-dev.yml —— dev 环境：本地中间件连接 + 启动建表 + 打印 SQL
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aicyi_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  data:
    redis:
      # 显式 127.0.0.1：macOS 下 localhost 可能优先解析 IPv6(::1)，导致 Docker 映射的 IPv4 端口连接失败
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:root}

  sql:
    init:
      # 启动执行 schema.sql（DDL 全 IF NOT EXISTS 幂等），确保 RBAC 表结构存在
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false

mybatis-plus:
  configuration:
    # 打印 SQL 日志，便于本地排查
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
