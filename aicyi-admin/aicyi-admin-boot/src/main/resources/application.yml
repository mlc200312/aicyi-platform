# aicyi-admin 通用配置（环境差异见 application-{dev,test,prod}.yml）
server:
  # 统一入口 gateway 18000：auth 18090 / admin 18091 / log 18092 / message 18093 / work-order 18094
  port: ${SERVER_PORT:18091}

spring:
  application:
    name: aicyi-admin

aicyi:
# Token 框架（RefreshToken 注册表：管理侧踢会话能力）
  # 身份由网关统一校验后 X-User-Id / X-Username 透传；本服务装配 Token Bean 仅用于
  # SessionRevoker 吊销会话（删除/禁用/重置密码后踢下线）。
  # 互通约束：secret-key / issuer / subject 必须与 aicyi-auth 一致，共用 Redis token 注册表。
  token:
    enabled: true
    secret-key: ${AICYI_TOKEN_SECRET:aicyi-cloud-admin-dev-secret-key-please-change-2026}
    issuer: aicyi-cloud-admin
    subject: admin-token
    # 键空间前缀：与网关吊销校验、aicyi-auth 签发端共享同一键空间（统一令牌域，SessionRevoker 跨服务踢下线据此生效）
    key-prefix: aicyi-cloud-admin-token
    # 会话绑定吊销判定：删除/禁用/重置密码触发的踢下线秒级失效已签发 AccessToken
    access-session-binding: true
    legacy-token-policy: accept
    revocation-fail-strategy: open
    state-cache-ttl-seconds: 30
    # principal 类型：AccessToken 载荷（实现 JwtInfo）
    principal-type: io.github.aicyi.admin.domain.bo.LoginUser
    # AccessToken 2 小时 / RefreshToken 30 天
    access-token-ttl: 7200
    refresh-token-ttl: 2592000
    # 单点会话控制：与 aicyi-auth 签发侧保持一致
    multi-token-allowed: false
    multi-token-count: 1
    # principal claim 白名单：网关据此解析并透传 X-User-Id / X-Username
    principal-claim-fields:
      - userId
      - username

  logging:
    # 日志文件路径：默认启动工作目录 logs/ 下；生产经 LOG_PATH 注入绝对路径
    path: ${LOG_PATH:logs}

  operate-log:
    # 操作日志审计：@OperLog 注解采集，db 存储写 sys_oper_log
    enabled: true
    storage:
      type: db
    async:
      # 异步写库线程池：核心 2 / 最大 4 / 队列 1000，满则调用线程执行（不丢日志）
      core-size: 2
      max-size: 4
      queue-capacity: 1000
      reject-policy: CALLER_RUNS
    desensitize:
      # 请求参数 / 响应结果 JSON 按字段名脱敏
      enable: true
      sensitive-fields:
        - password
        - oldPassword
        - newPassword
        - refreshToken
        - accessToken
        - token
        - secret
        - mobile
        - email
  mybatis-plus:
    # 注册框架共享 Mapper（SysOperLogMapper）：@OperLog 的 db 存储落库依赖；
    # MapperScan 注册的 Mapper 定义晚于解析期 @ConditionalOnBean 的可见范围，
    # 不开启共享扫描则 db 存储静默缺位、审计留痕全量失败
    shared-mapper-enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 枚举统一按 code 映射：业务实体字段显式 @TableField(typeHandler = IEnumTypeHandler)，全局默认处理器兜底
    default-enum-type-handler: io.github.aicyi.infra.mybatisplus.handlers.IEnumTypeHandler

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    io.github.aicyi.admin: INFO
